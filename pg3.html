<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF=8">
    <title>FORMULARZ</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <form class="strona" id="formi">
        <div class="formula">
        <p class="box">
        <label for="name">Imię:</label>
        <input type="text" id="name" name="Imię" 
        pattern="[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{3,}" title="Wpisz tylko litery (3 lub więcej)" required />
        </p>
        <p class="box">
        <label for="surname">Nazwisko:</label>
        <input type="text" id="surname" name="Nazwisko" 
        pattern="^[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{2,}(-[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{2,})?$" title="Niepoprawny format (muszą być przynajmniej 2 litery w każdym członie nazwiska)" required />
        </p>
        <div class="box">
            <span>Płeć:</span>
            <div class="radio-">
                <label><input type="radio" name="Płeć" value="Kobieta" required> Kobieta</label>
                <label><input type="radio" name="Płeć" value="Mężczyzna" required> Mężczyzna</label>
            </div>
        </div>
        <p class="box">
        <label for="street">Ulica:</label>
        <input type="text" id="street" name="Ulica" 
        pattern="^[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż1234567890]+([ \-][A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż1234567890]+)*$" required />
        </p>
        <p class="box">
        <label for="streetno">Numer domu/lokalu:</label>
        <input type="text" pattern="^[1234567890]+[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]?(/[1234567890]+)?$" id="streetno" name="Numer domu/lokalu" required />
        </p>
        <p class="box">
        <label for="e-mail">e-mail:</label>
        <input type="email" id="e-mail" name="e-mail"  required /> 
        </p>
        <p class="box">
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="Hasło" 
        pattern="(?=.*[1234567890])(?=.*[A-ZĄĆĘŁŃÓŚŹŻ])(?=.*[\W_]).{8,}" title="Hasło musi mieć minimum 8 znaków, zawierać przynajmniej jedną wielką literę, jedną cyfrę i jeden znak specjalny." required />
        </p>
        <p class="box">
        <label for="password2">Powtórz hasło:</label>
        <input type="password" id="password2" name="Hasło2" 
        pattern="(?=.*[1234567890])(?=.*[A-ZĄĆĘŁŃÓŚŹŻ])(?=.*[\W_]).{8,}" title="Hasło musi mieć minimum 8 znaków, zawierać przynajmniej jedną wielką literę, jedną cyfrę i jeden znak specjalny." required />
        </p>
        <p class="box">
        <label for="date">Data urodzenia:</label>
        <input type="date" id="date" name="Data urodzenia" required />
        </p>
        <p class="box">
        <label for="numer">Telefon:</label>
        <input type="text" inputmode="numeric" id="numer" name="Numer tel." pattern="[1234567890]+" minlength="9" maxlength="9" required/>
        </p>
        <p class="box">
        <label for="voievoidship">Województwo:</label>
        <select id="voievoidship" name="Województwo" required>
                    <option value="" selected>-</option>
                    <option value="dolnoslaskie">Dolnośląskie</option>
                    <option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
                    <option value="lubelskie">Lubelskie</option>
                    <option value="lubuskie">Lubuskie</option>
                    <option value="lodzkie">Łódzkie</option>
                    <option value="malopolskie">Małopolskie</option>
                    <option value="mazowieckie">Mazowieckie</option>
                    <option value="opolskie">Opolskie</option>
                    <option value="podkarpackie">Podkarpackie</option>
                    <option value="podlaskie">Podlaskie</option>
                    <option value="pomorskie">Pomorskie</option>
                    <option value="slaskie">Śląskie</option>
                    <option value="swietokrzyskie">Świętokrzyskie</option>
                    <option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
                    <option value="wielkopolskie">Wielkopolskie</option>
                    <option value="zachodniopomorskie">Zachodniopomorskie</option>
                </select>
        </p>
        <div class="box">
            <span>Prawo jazdy:</span>
            <div class="radio-">
                <label><input type="radio" name="Prawo jazdy" value="Tak" required> Tak</label>
                <label><input type="radio" name="Prawo jazdy" value="Nie" required> Nie</label>
            </div>
        </div>
        <p class="box">
        <label for="notes">Uwagi:</label>
        <textarea id="notes" name="Uwagi" rows="5" cols="40"></textarea>
        </p>
        </div>
        <p class="submity">
        <button type="submit" form="formi" value="Zatwierdź">Zatwierdź</button>
        </p>
        </form>
        <nav>
            <p class="centruj">
            <a class="ramka" href="index.html">GŁÓWNA</a>
            <a class="ramka" href="pg3.html">FORMULARZ</a>
            <a class="ramka" href="pg2.html">PG1</a> 
            <a class="ramka" href="pg5.html">PG2</a> 
            <a class="ramka" href="pg6.html">GALERIA</a> 
            <a class="ramka" href="strona1.html">AI</a> 
            </p>
        </nav>
        
        <script>
        
        document.getElementById('formi').addEventListener('submit', function(e) {
            e.preventDefault();


            if (document.getElementById('password').value !== document.getElementById('password2').value)
            {
                alert("Hasła muszą być takie same")
                return;
            } 

            const formData = new FormData(this);
            for (let [name, wartosc] of formData.entries()) {
                localStorage.setItem(name, wartosc);
            }

            alert("Dane zostały zapisane");
        });
        </script>
    </body>
</html>
