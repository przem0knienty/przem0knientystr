<!DOCTYPE html>
<html>
    <form action="/konto" method="post" onsubmit="window.location.href='pg4.html';return false;">
        <p>
        <label for="name">Imię:</label>
        <input type="text" id="name" name="name" required />
        </p>
        <p>
        <label for="surname">Nazwisko:</label>
        <input type="text" id="surname" name="surname" required />
        </p>
        <p>
        <label for="street">Ulica:</label>
        <input type="text" id="street" name="street" required />
        </p>
        <p>
        <label for="e-mail">e-mail:</label>
        <input type="email" id="e-mail" name="e-mail"  required /> 
        </p>
        <p>
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" required />
        </p>
        <p>
        <label for="date">Data urodzenia:</label>
        <input type="date" id="date" name="date" required />
        </p>
        <p>
        <label for="numer">Telefon:</label>
        <input type="text" inputmode="numeric" id="numer" name="numer" minlength="9" maxlength="9" pattern="\d{9}" required/>
        </p>
        <p>
        <label for="voievoidship">Województwo:</label>
        <input type="text" id="voievoidship" name="voievoidship" required />
        </p>
        <p>
        <label for="dlicence">Prawo jazdy:</label>
        <input type="number" id="dlicence" name="dlicence" required />
        </p>
        <p>
        <label for="notes">Uwagi:</label>
        <input type="text" id="notes" name="notes" />
        </p>
        <p>
        <input type="submit" value="Wyślij">
        </p>
        </form>
</html>
