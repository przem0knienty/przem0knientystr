    <form class="strona" action="/konto" method="post" 
    onsubmit="if(document.getElementById('password').value !== document.getElementById('password2').value) {alert('Hasła mają być takie same');return false}">
        <div class="formula">
        <p class="box">
        <label for="name">Imię:</label>
        <input type="text" id="name" name="name" 
        pattern="[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{3,}" title="Wpisz tylko litery (3 lub więcej)" required />
        </p>
        <p class="box">
        <label for="surname">Nazwisko:</label>
        <input type="text" id="surname" name="surname" 
        pattern="^[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{2,}(-[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśź]{2,})?$" title="Niepoprawny format (muszą być przynajmniej 2 litery w każdym członie nazwiska)" required />
        </p>
        <div class="box">
            <span>Płeć:</span>
            <div class="radio-">
                <label><input type="radio" name="plec" value="k" required> Kobieta</label>
                <label><input type="radio" name="plec" value="m" required> Mężczyzna</label>
            </div>
        </div>
        <p class="box">
        <label for="street">Ulica:</label>
        <input type="text" id="street" name="street" 
        pattern="^[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśźż]{2,}(-[A-Za-zĄĆĘŁŃÓŚŹŻąćęłńóśź]{2,})?$" required />
        </p>
        <p class="box">
        <label for="street">Numer ulicy:</label>
        <input type="text" pattern="^[1-9]{1,}(/[1-9]{1,})?$" id="streetno" name="streetno" required />
        </p>
        <p class="box">
        <label for="e-mail">e-mail:</label>
        <input type="email" id="e-mail" name="e-mail"  required /> 
        </p>
        <p class="box">
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" required />
        </p>
        <p class="box">
        <label for="password">Powtórz hasło:</label>
        <input type="password" id="password2" name="password" required />
        </p>
        <p class="box">
        <label for="date">Data urodzenia:</label>
        <input type="date" id="date" name="date" required />
        </p>
        <p class="box">
        <label for="numer">Telefon:</label>
        <input type="text" inputmode="numeric" id="numer" name="numer" minlength="9" maxlength="9" pattern="\d{9}" required/>
        </p>
        <p class="box">
        <label for="voievoidship">Województwo:</label>
        <select name="wojewdztwo" required>
                    <option value="" selected>-</option>
                    <option value="dolnoslaskie">Dolnośląskie</option>
                    <option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
                    <option value="lubelskie">Lubelskie</option>
                    <option value="lubuskie">Lubuskie</option>
                    <option value="lodzkie">Łódzkie</option>
                    <option value="malopolskie">Małopolskie</option>
                    <option value="mazowieckie">Mazowieckie</option>
                    <option value="opolskie">Opolskie</option>
                    <option value="podkarpackie">Podkarpackie</option>
                    <option value="podlaskie">Podlaskie</option>
                    <option value="pomorskie">Pomorskie</option>
                    <option value="slaskie">Śląskie</option>
                    <option value="swietokrzyskie">Świętokrzyskie</option>
                    <option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
                    <option value="wielkopolskie">Wielkopolskie</option>
                    <option value="zachodniopomorskie">Zachodniopomorskie</option>
                </select>
        </p>
        <div class="box">
            <span>Prawo jazdy:</span>
            <div class="radio-">
                <label><input type="radio" name="prawo" value="tak" required> Tak</label>
                <label><input type="radio" name="prawo" value="nie" required> Nie</label>
            </div>
        </div>
        <p class="box">
        <label for="notes">Uwagi:</label>
        <input type="text" id="notes" name="notes" />
        </p>
        </div>
        <p class="submity">
        <input type="submit" value="Wyślij"> 
        </p>
        </form>
</html>
