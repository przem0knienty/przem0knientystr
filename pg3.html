<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF=8">
    <title>FORMULARZ</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <nav>
        <p class="centruj">
            <a class="ramka" href="index.html">GŁÓWNA</a>
            <a class="ramka" href="pg3.html">FORMULARZ</a>

    <form class="strona" action="/konto" method="post" onsubmit="window.location.href='pg4.html';return false;">
        <p class="box">
        <label for="name">Imię:</label>
        <input type="text" id="name" name="name" required />
        </p>
        <p class="box">
        <label for="surname">Nazwisko:</label>
        <input type="text" id="surname" name="surname" required />
        </p>
        <div class="box">
            <span>Płeć:</span>
            <div class="radio-">
                <label><input type="radio" name="plec" value="k" required> Kobieta</label>
                <label><input type="radio" name="plec" value="m" required> Mężczyzna</label>
            </div>
        </div>
        <p class="box">
        <label for="street">Ulica:</label>
        <input type="text" id="street" name="street" required />
        </p>
        <p class="box">
        <label for="e-mail">e-mail:</label>
        <input type="email" id="e-mail" name="e-mail"  required /> 
        </p>
        <p class="box">
        <label for="password">Hasło:</label>
        <input type="password" id="password" name="password" required />
        </p>
        <p class="box">
        <label for="date">Data urodzenia:</label>
        <input type="date" id="date" name="date" required />
        </p>
        <p class="box">
        <label for="numer">Telefon:</label>
        <input type="text" inputmode="numeric" id="numer" name="numer" minlength="9" maxlength="9" pattern="\d{9}" required/>
        </p>
        <p class="box">
        <label for="voievoidship">Województwo:</label>
        <select name="wojewdztwo" required>
                    <option value="dolnoslaskie">Dolnośląskie</option>
                    <option value="kujawsko-pomorskie">Kujawsko-pomorskie</option>
                    <option value="lubelskie">Lubelskie</option>
                    <option value="lubuskie">Lubuskie</option>
                    <option value="lodzkie">Łódzkie</option>
                    <option value="malopolskie">Małopolskie</option>
                    <option value="mazowieckie">Mazowieckie</option>
                    <option value="opolskie">Opolskie</option>
                    <option value="podkarpackie">Podkarpackie</option>
                    <option value="podlaskie">Podlaskie</option>
                    <option value="pomorskie">Pomorskie</option>
                    <option value="slaskie">Śląskie</option>
                    <option value="swietokrzyskie">Świętokrzyskie</option>
                    <option value="warminsko-mazurskie">Warmińsko-mazurskie</option>
                    <option value="wielkopolskie">Wielkopolskie</option>
                    <option value="zachodniopomorskie">Zachodniopomorskie</option>
                </select>
        </p>
        <p class="box">
        <label for="dlicence">Prawo jazdy:</label>
        <input type="number" id="dlicence" name="dlicence" required />
        </p>
        <p class="box">
        <label for="notes">Uwagi:</label>
        <input type="text" id="notes" name="notes" />
        </p>
        <p class="box">
        <input type="submit" value="Wyślij"> 
        </p>
        </form>
</html>
