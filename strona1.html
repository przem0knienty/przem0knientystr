<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Załóż konto</title>
  <link rel="stylesheet" href="styl.css">
</head>
<body>
  <nav>
    <a href="strona1.html" class="aktywna">Formularz</a>
    <a href="strona2.html">Tekst 1</a>
    <a href="strona3.html">Tekst 2</a>
    <a href="strona4.html">Galeria</a>
    <a href="index.html">POWRÓT</a>
  </nav>
  <main class="strona">
    <h1>Załóż konto</h1>
    <form action="#" method="post">
      <div class="pole"><label for="imie">Imię</label><input type="text" id="imie" name="imie" required></div>
      <div class="pole"><label for="nazwisko">Nazwisko</label><input type="text" id="nazwisko" name="nazwisko" required></div>
      <div class="pole"><label for="email">E-mail</label><input type="email" id="email" name="email" required></div>
      <div class="pole"><label for="haslo">Hasło</label><input type="password" id="haslo" name="haslo" required></div>
      <div class="pole"><label for="regulamin">Regulamin</label><input type="checkbox" id="regulamin" name="regulamin" required></div>
      <div class="pole">
        <label for="kraj">Kraj</label>
        <select id="kraj" name="kraj">
          <option>Polska</option>
          <option>Niemcy</option>
          <option>Czechy</option>
          <option>Inny</option>
        </select>
      </div>
      <div class="pole">
        <span>Płeć</span>
        <div class="radio-grupa">
          <label><input type="radio" name="plec" value="k"> Kobieta</label>
          <label><input type="radio" name="plec" value="m"> Mężczyzna</label>
        </div>
      </div>
      <button type="submit">Utwórz konto</button>
    </form>
  </main>
</body>
</html>
